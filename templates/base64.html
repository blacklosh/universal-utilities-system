{% extends "base.html" %}
{% block title %}Конвертер Base64 · Universal Utility Tool{% endblock %}
{% block content %}
<h1>Конвертер Base64</h1>
<div class="tool-grid base64-grid">
  <section class="panel base64-panel" aria-labelledby="encode-title">
    <h2 id="encode-title">Кодирование в Base64</h2>
    <label for="encode-input">Текст</label>
    <textarea id="encode-input" rows="5" spellcheck="false" dir="auto"></textarea>
    <div class="base64-actions">
      <button type="button" id="encode-text">Кодировать текст</button>
    </div>
    <label class="count" for="encode-file">Файл</label>
    <input type="file" id="encode-file">
    <div class="base64-actions">
      <button type="button" id="encode-file-button" disabled>Кодировать файл</button>
    </div>
    <div class="result-header base64-result">
      <label for="encode-output">Результат Base64</label>
      <button type="button" id="encode-copy" disabled>Копировать</button>
    </div>
    <textarea id="encode-output" rows="5" readonly spellcheck="false"></textarea>
    <p class="base64-status" id="encode-status" role="status"></p>
  </section>
  <section class="panel base64-panel" aria-labelledby="decode-title">
    <h2 id="decode-title">Декодирование Base64</h2>
    <label for="decode-input">Строка Base64</label>
    <textarea id="decode-input" rows="5" spellcheck="false"></textarea>
    <div class="base64-actions">
      <button type="button" id="decode-text">Декодировать в текст</button>
    </div>
    <div class="result-header base64-result">
      <label for="decode-output">Результат UTF-8</label>
      <button type="button" id="decode-copy" disabled>Копировать</button>
    </div>
    <textarea id="decode-output" rows="5" readonly spellcheck="false" dir="auto"></textarea>
    <p class="base64-status" id="decode-status" role="status"></p>
  </section>
</div>
<script src="{{ url_for('static', path='base64.js') }}" defer></script>
{% endblock %}
